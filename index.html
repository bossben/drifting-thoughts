<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Drifting Thoughts</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background: radial-gradient(ellipse at bottom, #0d1b2a 0%, #000000 100%);
      overflow: hidden;
      font-family: 'Segoe UI', sans-serif;
      position: relative;
    }

    #debugTimer {
      position: fixed;
      top: 10px;
      left: 10px;
      color: white;
      font-family: monospace;
      z-index: 5;
      background: rgba(0, 0, 0, 0.3);
      padding: 4px 8px;
      border-radius: 4px;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
    }

    #inputContainer {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
    }

    #thoughtInput {
      padding: 12px 20px;
      font-size: 18px;
      width: 360px;
      background: rgba(255, 255, 255, 0.1);
      color: white;
      border: 1px solid #aaa;
      border-radius: 10px;
      backdrop-filter: blur(5px);
      outline: none;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
      position: relative;
      z-index: 2;
      resize: none;
      overflow: hidden;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: calc(1.4em + 24px);
    }

    .drifting {
      position: absolute;
      font-size: 18px;
      color: #aeefff;
      text-shadow: 0 0 5px #aeefff, 0 0 10px #00ffff;
      white-space: pre-wrap;
      word-break: break-word;
      opacity: 1;
      animation: drift 5s ease-out forwards;
      z-index: 3;
      pointer-events: none;
    }

    @keyframes drift {
      to {
        transform: translate(var(--x), var(--y));
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <!-- Debug timer (shows seconds until next shooting star) -->
  <div id="debugTimer"></div>

  <canvas id="starCanvas"></canvas>

  <div id="inputContainer">
    <textarea id="thoughtInput" rows="1" placeholder="Type your thought and press Enter..."></textarea>
  </div>

  <script>
    const DEBUG = false;
    const input = document.getElementById('thoughtInput');
    const debugTimer = document.getElementById('debugTimer');

    // Enter vs Shift+Enter
    input.addEventListener('keydown', function(event) {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        if (input.value.trim() !== '') {
          createDriftingText(input);
          input.value = '';
        }
      }
    });

    function createDriftingText(inputEl) {
      const rect = inputEl.getBoundingClientRect();
      const span = document.createElement('span');
      span.className = 'drifting';
      span.textContent = inputEl.value;
      span.style.width = inputEl.offsetWidth + 'px';
      span.style.left = `${rect.left + 22}px`;
      span.style.top = `${rect.top + rect.height/2 - 12}px`;
      const dx = ((Math.random() - 0.5) * 1200) + 'px';
      const dy = ((Math.random() - 0.5) * 1200) + 'px';
      span.style.setProperty('--x', dx);
      span.style.setProperty('--y', dy);
      document.body.appendChild(span);
      span.addEventListener('animationend', () => span.remove());
    }

    // STARFIELD & SHOOTING STARS
    const canvas = document.getElementById('starCanvas');
    const ctx = canvas.getContext('2d');
    let stars = [];
    const numStars = 300;
    let shootingStars = [];
    let nextShootingStarTime = 0;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    function initStars() {
      stars = [];
      for (let i = 0; i < numStars; i++) {
        stars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          radius: Math.random() * 1.5,
          alpha: Math.random(),
          delta: Math.random() * 0.02
        });
      }
    }

    function drawStars() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      stars.forEach(s => {
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.radius, 0, 2 * Math.PI);
        ctx.fillStyle = `rgba(255,255,255,${s.alpha})`;
        ctx.fill();
        s.alpha += s.delta;
        if (s.alpha <= 0 || s.alpha >= 1) s.delta = -s.delta;
      });
    }

    function scheduleNextShootingStar(first = false) {
      const min = first ? 3000 : 20000;
      const max = first ? 15000 : 40000;
      const interval = min + Math.random() * (max - min);
      nextShootingStarTime = Date.now() + interval;
      setTimeout(launchShootingStar, interval);
    }

    function launchShootingStar() {
      const { width, height } = canvas;
      const length = 200;
      // 10% margin to avoid corners
      const margin = 0.1;
      const edge = Math.floor(Math.random() * 4);
      let startX, startY, angle;
      switch(edge) {
        case 0: // left
          startX = -length;
          startY = height * (margin + Math.random() * (1 - 2 * margin));
          angle = (Math.random() - 0.5) * Math.PI/2; // -45 to +45°
          break;
        case 1: // top
          startX = width * (margin + Math.random() * (1 - 2 * margin));
          startY = -length;
          angle = Math.PI/2 + (Math.random() - 0.5) * Math.PI/2; // 45 to 135°
          break;
        case 2: // right
          startX = width + length;
          startY = height * (margin + Math.random() * (1 - 2 * margin));
          angle = Math.PI + (Math.random() - 0.5) * Math.PI/2; // 135 to 225°
          break;
        case 3: // bottom
          startX = width * (margin + Math.random() * (1 - 2 * margin));
          startY = height + length;
          angle = -Math.PI/2 + (Math.random() - 0.5) * Math.PI/2; // -135 to -45°
          break;
      }
      const speed = 8 + Math.random() * 4;
      const vx = Math.cos(angle) * speed;
      const vy = Math.sin(angle) * speed;
      shootingStars.push({ x: startX, y: startY, vx, vy, length });
      scheduleNextShootingStar();
    }

    function drawShootingStars() {
      const { width, height } = canvas;
      ctx.save();
      ctx.lineWidth = 2;
      ctx.strokeStyle = 'rgba(255,255,255,0.8)';
      for (let i = shootingStars.length - 1; i >= 0; i--) {
        const s = shootingStars[i];
        const norm = Math.hypot(s.vx, s.vy);
        const tailX = s.x - (s.vx / norm) * s.length;
        const tailY = s.y - (s.vy / norm) * s.length;
        ctx.beginPath();
        ctx.moveTo(tailX, tailY);
        ctx.lineTo(s.x, s.y);
        ctx.stroke();
        s.x += s.vx;
        s.y += s.vy;
        // remove after fully off-screen
        if (s.x < -s.length || s.x > width + s.length || s.y < -s.length || s.y > height + s.length) {
          shootingStars.splice(i, 1);
        }
      }
      ctx.restore();
    }

    function animate() {
      drawStars();
      drawShootingStars();
      if (DEBUG) {
        const diff = nextShootingStarTime - Date.now();
        debugTimer.textContent = `Next star in: ${diff > 0 ? (diff / 1000).toFixed(1) : '0.0'}s`;
      }
      requestAnimationFrame(animate);
    }

    window.addEventListener('resize', () => {
      resizeCanvas();
      initStars();
    });

    // Initialize
    resizeCanvas();
    initStars();
    animate();
    scheduleNextShootingStar(true);
  </script>
</body>
</html>
